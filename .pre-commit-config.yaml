# Pre-commit hooks. Install with `just hooks` (or `uv run pre-commit install`).
# Run against everything with `just hooks-all`.
# Refresh pinned revs with `uv run pre-commit autoupdate`.
default_install_hook_types: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 8 MB: sweep results JSONs (committed data records under
        # docs/research/assets/) carry per-neuron q arrays and reach ~4-5 MB
        # for per-position CNN runs. Still guards against accidental
        # checkpoint/dataset commits (tens to hundreds of MB).
        args: ["--maxkb=8192"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: lint (with autofix) MUST run before the formatter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty has no official pre-commit hook yet (astral-sh/ty#269), so run it as a
  # local hook through uv. `uv run` keeps the env in sync with the lockfile.
  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
